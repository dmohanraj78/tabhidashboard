name: Categorize News

on:
  repository_dispatch:
    types: [trigger-categorizer]
  workflow_dispatch:
  schedule:
    # Native fallback so categorization doesn't depend solely on the external
    # dispatcher. Runs 9:15 AM UTC daily, ~45 min after the scraper's own
    # 08:30 UTC cron, so there's fresh, already-pushed data to categorize.
    - cron: '15 9 * * *'

jobs:
  categorize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r News_Intelligence/requirements.txt
          
      - name: Run Categorizer Job
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'gpt-oss:20b-cloud' }}
        run: |
          python News_Intelligence/src/categorizer_job.py
          
      - name: Commit and Push Updated Excel Databases
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add News_Dashboard/data/ News_Intelligence/output/
          git diff-index --quiet HEAD || git commit -m "Auto-categorize news databases"
          for i in 1 2 3 4 5; do
            # -X theirs keeps THIS job's categorization work on conflict (rebase inverts
            # ours/theirs vs merge: "ours" here means the remote, which would silently
            # discard this run's LLM categorization if the scraper pushes at the same time).
            git pull --rebase -X theirs && git push && break
            echo "Push attempt $i failed (likely a concurrent push from another workflow), retrying..."
            sleep $((RANDOM % 10 + 5))
          done
